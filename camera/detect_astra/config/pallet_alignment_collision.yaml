pallet_alignment_collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: /pallet/alignment/cmd_vel
    cmd_vel_out_topic: /cmd_vel_safe
    state_topic: /pallet/alignment/collision_state
    transform_tolerance: 0.1
    source_timeout: 0.3
    base_shift_correction: true
    stop_pub_timeout: 1.0
    # Full chassis + fork footprint, expanded by 15 cm for this slow trial.
    polygons: [StopZone]
    StopZone:
      type: polygon
      points: '[[0.96,0.28],[0.96,-0.28],[0.56,-0.43],[-0.51,-0.43],[-0.51,0.43],[0.56,0.43]]'
      action_type: stop
      min_points: 2
      visualize: true
      polygon_pub_topic: /pallet/alignment/stop_zone
      enabled: true
    observation_sources: [scan]
    scan:
      type: scan
      topic: /scan_filtered
      enabled: true
